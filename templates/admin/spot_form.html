<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if spot %}スポットを編集{% else %}スポットを追加{% endif %} - 管理画面</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width:540px;">
  <h2 class="h4 fw-bold mb-1">{% if spot %}スポットを編集{% else %}スポットを追加{% endif %}</h2>
  <p class="text-muted small mb-4">{{ day.title }}（{{ day.date }}）</p>

  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form method="post" action="{% if spot %}/admin/spots/{{ spot.id }}/edit{% else %}/admin/days/{{ day.id }}/spots{% endif %}">

        <div class="mb-3">
          <label class="form-label fw-bold">スポット名 <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" placeholder="例：名古屋城"
            value="{{ spot.name if spot else '' }}" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">カテゴリ <span class="text-danger">*</span></label>
          <select name="category" class="form-select" required>
            {% for cat in categories %}
            <option value="{{ cat }}" {% if spot and spot.category == cat %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">時刻（任意）</label>
          <input type="text" name="time" class="form-control" placeholder="例：10:30"
            value="{{ spot.time if spot else '' }}">
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">メモ（任意）</label>
          <textarea name="notes" class="form-control" rows="3"
            placeholder="営業時間、料金、おすすめメニューなど">{{ spot.notes if spot else '' }}</textarea>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">Google マップ URL（任意）</label>
          <input type="url" name="map_url" class="form-control"
            placeholder="https://maps.google.com/..."
            value="{{ spot.map_url if spot else '' }}">
          <div class="form-text">Google マップでスポットを開き、URLをコピーして貼り付け</div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger">保存</button>
          <a href="/admin/days/{{ day.id }}/spots" class="btn btn-outline-secondary">キャンセル</a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
