<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理画面 - 名古屋旅行2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark shadow-sm" style="background: linear-gradient(135deg, #b71c1c, #880e4f);">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/admin">管理画面</a>
    <div class="d-flex gap-2">
      <a href="/" class="btn btn-outline-light btn-sm">サイトを見る</a>
      <a href="/admin/logout" class="btn btn-outline-light btn-sm">ログアウト</a>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h4 fw-bold mb-0">日程管理</h2>
    <a href="/admin/days/new" class="btn btn-danger">
      <i class="bi bi-plus-lg me-1"></i>日程を追加
    </a>
  </div>

  {% if days %}
  <div class="d-flex flex-column gap-3">
    {% for day in days %}
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div>
            <h5 class="fw-bold mb-0">{{ day.title }}</h5>
            <small class="text-muted">{{ day.date }} &nbsp;|&nbsp; {{ day.spots|length }} 件のスポット</small>
          </div>
          <div class="d-flex gap-2">
            <a href="/admin/days/{{ day.id }}/spots" class="btn btn-outline-primary btn-sm">
              <i class="bi bi-pin-map me-1"></i>スポット管理
            </a>
            <a href="/admin/days/{{ day.id }}/edit" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-pencil me-1"></i>編集
            </a>
            <form method="post" action="/admin/days/{{ day.id }}/delete" onsubmit="return confirm('「{{ day.title }}」を削除しますか？')">
              <button type="submit" class="btn btn-outline-danger btn-sm">
                <i class="bi bi-trash me-1"></i>削除
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <div class="text-center py-5 text-muted">
    <i class="bi bi-calendar-plus display-3 d-block mb-3"></i>
    日程がまだありません。「日程を追加」から始めましょう。
  </div>
  {% endif %}
</div>
</body>
</html>
