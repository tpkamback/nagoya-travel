<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if day %}日程を編集{% else %}日程を追加{% endif %} - 管理画面</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width:540px;">
  <h2 class="h4 fw-bold mb-4">{% if day %}日程を編集{% else %}日程を追加{% endif %}</h2>

  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form method="post" action="{% if day %}/admin/days/{{ day.id }}/edit{% else %}/admin/days{% endif %}">
        <div class="mb-3">
          <label class="form-label fw-bold">日付 <span class="text-danger">*</span></label>
          <input type="text" name="date" class="form-control" placeholder="例：2026年5月1日（金）"
            value="{{ day.date if day else '' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">タイトル <span class="text-danger">*</span></label>
          <input type="text" name="title" class="form-control" placeholder="例：名古屋城・栄エリア散策"
            value="{{ day.title if day else '' }}" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-bold">メモ（任意）</label>
          <textarea name="description" class="form-control" rows="3"
            placeholder="この日のテーマや移動手段など">{{ day.description if day else '' }}</textarea>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger">保存</button>
          <a href="/admin" class="btn btn-outline-secondary">キャンセル</a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
