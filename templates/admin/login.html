<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者ログイン - 名古屋旅行2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh;">
<div class="card shadow-sm" style="width:360px;">
  <div class="card-header text-white text-center py-3" style="background: linear-gradient(135deg, #b71c1c, #880e4f);">
    <h5 class="mb-0">管理者ログイン</h5>
  </div>
  <div class="card-body p-4">
    {% if error %}
    <div class="alert alert-danger py-2 small">パスワードが違います</div>
    {% endif %}
    <form method="post" action="/admin/login">
      <div class="mb-3">
        <label class="form-label small fw-bold">パスワード</label>
        <input type="password" name="password" class="form-control" autofocus required>
      </div>
      <button type="submit" class="btn btn-danger w-100">ログイン</button>
    </form>
  </div>
  <div class="card-footer text-center">
    <a href="/" class="text-muted small">← 旅程を見る</a>
  </div>
</div>
</body>
</html>
